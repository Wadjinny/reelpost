[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reelpost"
version = "0.1.0"
description = "Publish Reels to Instagram and a Facebook Page from one command"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.32",
  "pillow>=10",
]

[project.scripts]
reelpost = "reelpost.cli:console_main"

[tool.setuptools.packages.find]
where = ["src"]
